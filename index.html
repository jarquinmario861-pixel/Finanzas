<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#6b7686;--pr:#1f3864;--ac:#2f80ed;--ok:#1e8e5a;--wa:#b7791f;--er:#c53030;--bd:#e2e7ef;--in:#fffaf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2230;--tx:#e8edf5;--mu:#98a3b5;--pr:#8fb4ff;--ac:#5b9cf5;--ok:#4cc38a;--wa:#e0b04a;--er:#f08080;--bd:#2a3446;--in:#222c3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2230;--tx:#e8edf5;--mu:#98a3b5;--pr:#8fb4ff;--ac:#5b9cf5;--ok:#4cc38a;--wa:#e0b04a;--er:#f08080;--bd:#2a3446;--in:#222c3d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0 2px;color:var(--pr)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:20px 0 8px}
.sub{color:var(--mu);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.kpi small{display:block;color:var(--mu);font-size:12px}
.kpi b{font-size:17px}
.row{display:grid;grid-template-columns:1fr 84px 84px 28px;gap:6px;margin-bottom:6px;align-items:center}
.row.h{color:var(--mu);font-size:12px}
input,select{width:100%;min-width:0;padding:9px 8px;border:1px solid var(--bd);border-radius:9px;background:var(--in);color:var(--tx);font:inherit}
.x{background:none;border:0;color:var(--er);font-size:18px;padding:0}
.add{width:100%;padding:10px;border:1px dashed var(--ac);color:var(--ac);background:none;border-radius:10px;font:inherit;margin-top:4px}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:8px;border-top:1px solid var(--bd);margin-top:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}
.Pagado{background:rgba(30,142,90,.15);color:var(--ok)}.Parcial{background:rgba(183,121,31,.18);color:var(--wa)}.Pendiente{background:rgba(197,48,48,.15);color:var(--er)}
.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.line{display:flex;justify-content:space-between;padding:4px 0}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:10px 1px;color:var(--mu);text-decoration:none;font-size:11px}
nav a b{display:block;font-size:20px}
nav a.on{color:var(--pr);font-weight:700}
.ft{margin-top:22px;display:flex;gap:8px}
.ft button{flex:1;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx);font:inherit}
@media print{nav,.ft,.add,.x{display:none!important}}
</style>

<nav id="nav"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var KEY="mis-finanzas-v1";
var CATS=["Comida","Gasolina","Salud","Educación","Hogar","Ropa","Entretenimiento","Otros"];
var blank=function(){return{ing:[{n:"",q1:0,q2:0}],gas:[{n:"",q1:0,q2:0}],tc:[],gd:[],deu:[],mes:"",cap:{},rec:[],tj:[],metas:[],hist:{},cm:"",limite:0,meta:{n:"",monto:0,fecha:""},ahorro:[{n:"",m:0}],cons:[{n:"",m:0}]}};
var FB_CONFIG={apiKey:"PEGA_AQUI",authDomain:"PEGA_AQUI",projectId:"PEGA_AQUI",appId:"PEGA_AQUI"};
var S=blank(),uid=null,unsub=null,pend=null,amode="in",auth,db;
try{firebase.initializeApp(FB_CONFIG);auth=firebase.auth();db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
function td(){var n=new Date();return n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2)}
function save(){if(!uid)return;clearTimeout(pend);pend=setTimeout(function(){db.collection("users").doc(uid).set({data:JSON.stringify(S),t:Date.now()})},500)}
function errm(x){var c=(x&&x.code)||"";return /invalid-credential|user-not-found|wrong-password/.test(c)?"Correo o contraseña incorrectos":c==="auth/email-already-in-use"?"Ese correo ya tiene cuenta":c==="auth/weak-password"?"La contraseña debe tener al menos 6 caracteres":c==="auth/invalid-email"?"Correo no válido":"No se pudo completar. Revisa tu conexión."}
if(auth)auth.onAuthStateChanged(function(u){if(unsub){unsub();unsub=null}if(!u){uid=null;S=blank();render();return}uid=u.uid;unsub=db.collection("users").doc(uid).onSnapshot(function(d){if(d.metadata.hasPendingWrites)return;if(d.exists){try{S=Object.assign(blank(),JSON.parse(d.data().data))}catch(e){}}else{S=blank();save()}auto();render()})});
function C(n){n=Number(n)||0;return"C$"+n.toLocaleString("es-NI",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function sum(a,f){return a.reduce(function(t,x){return t+(Number(f(x))||0)},0)}
function nv(v){return v?v:""}
var TABS=[["presupuesto","📊","Presup."],["gastos","🧾","Gastos"],["tarjeta","💳","Tarjeta"],["meta","🎯","Meta"],["deudas","🤝","Deudas"],["resumen","📈","Resumen"]];
function tab(){var h=location.hash.replace("#",""),v=navTabs();return v.some(function(t){return t[0]===h})?h:v[0][0]}

function listRows(key,a,b){
  var h='<div class="row h"><span></span><span>'+a+'</span><span>'+b+'</span><span></span></div>';
  return h+S[key].map(function(r,i){
    return '<div class="row"><input data-l="'+key+'" data-i="'+i+'" data-k="n" value="'+esc(r.n)+'" placeholder="Nombre">'+
    '<input type="number" inputmode="decimal" step="any" data-l="'+key+'" data-i="'+i+'" data-k="q1" value="'+nv(r.q1)+'" placeholder="0">'+
    '<input type="number" inputmode="decimal" step="any" data-l="'+key+'" data-i="'+i+'" data-k="q2" value="'+nv(r.q2)+'" placeholder="0">'+
    '<button class="x" data-del="'+key+'" data-i="'+i+'">✕</button></div>'}).join("")+
    '<button class="add" data-add="'+key+'">+ Agregar</button>';
}
function simpleRows(key){
  return S[key].map(function(r,i){
    return '<div class="row" style="grid-template-columns:1fr 110px 28px"><input data-l="'+key+'" data-i="'+i+'" data-k="n" value="'+esc(r.n)+'" placeholder="Concepto">'+
    '<input type="number" inputmode="decimal" step="any" data-l="'+key+'" data-i="'+i+'" data-k="m" value="'+nv(r.m)+'" placeholder="0">'+
    '<button class="x" data-del="'+key+'" data-i="'+i+'">✕</button></div>'}).join("")+
    '<button class="add" data-add="'+key+'">+ Agregar</button>';
}
function pendTC(){return sum(S.tc,function(x){return x.m})-sum(S.tc,function(x){return x.p})}

function vPres(){
  var ti=sum(S.ing,function(x){return+x.q1+ +x.q2}),tg=sum(S.gas,function(x){return+x.q1+ +x.q2});
  var fl=ti-tg,tasa=ti?fl/ti:0,pt=pendTC(),gm=gdMes();
  return '<h1>Presupuesto mensual</h1><p class="sub">Anota tus ingresos y gastos fijos por quincena.</p>'+alertCard()+
  '<div class="kpi"><div><small>Ingresos</small><b>'+C(ti)+'</b></div><div><small>Gastos fijos</small><b>'+C(tg)+'</b></div>'+
  '<div><small>Flujo libre</small><b style="color:'+(fl<0?"var(--er)":"var(--ok)")+'">'+C(fl)+'</b></div><div><small>Tasa de ahorro</small><b>'+(tasa*100).toFixed(1)+'%</b></div></div>'+
  distBar(ti,tg,gm,pt)+'<h2>Ingresos</h2><div class="card">'+listRows("ing","1ra quin.","2da quin.")+'<div class="tot"><span>Total</span><span>'+C(ti)+'</span></div></div>'+
  '<h2>Gastos fijos</h2><div class="card">'+listRows("gas","1ra quin.","2da quin.")+'<div class="tot"><span>Total</span><span>'+C(tg)+'</span></div></div>'+
  '<div class="card"><div class="line"><span>Pendiente en tarjeta</span><b>'+C(pt)+'</b></div><div class="line"><span>Gastos diarios del mes</span><b>'+C(gm)+'</b></div><div class="line"><span>Flujo libre después de tarjeta y gastos</span><b>'+C(fl-pt-gm)+'</b></div></div>';

var unl=false;
function hh(s){var h=5381;s=s+"mf";for(var i=0;i<s.length;i++)h=(h*33)^s.charCodeAt(i);return String(h>>>0)}
function rx(s){var m;return(m=s.match(/^Restan (.*)$/))?"Remaining "+m[1]:(m=s.match(/^Saldo (.*)$/))?"Balance "+m[1]:(m=s.match(/^de (C\$.*)$/))?"of "+m[1]:(m=s.match(/^Te pasaste del tope de (.*)$/))?"You exceeded the cap for "+(EN[m[1]]||m[1]):(m=s.match(/^Vas cerca del tope de (.*)$/))?"You are close to the cap for "+(EN[m[1]]||m[1]):(m=s.match(/^Pago de (.*) en (\d+) días?$/))?"Payment for "+m[1]+" due in "+m[2]+" day(s)":(m=s.match(/^Pago en (\d+) días?$/))?"Payment due in "+m[1]+" day(s)":null}
function nx(k){var p=k.split("-"),d=new Date(+p[0],+p[1],1);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)}
function dd(dia){var n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),n.getDate()),t=new Date(a.getFullYear(),a.getMonth(),dia);if(t<a)t=new Date(a.getFullYear(),a.getMonth()+1,dia);return Math.round((t-a)/864e5)}
function auto(){var ch=0,nk=td().slice(0,7),ti=sum(S.ing,function(x){return+x.q1+ +x.q2}),fx=sum(S.gas,function(x){return+x.q1+ +x.q2});
  if(!S.cm){S.cm=nk;ch=1}else if(S.cm<nk){var k=S.cm;while(k<nk){S.hist[k]=S.hist[k]||{ing:ti,fix:fx};k=nx(k)}S.cm=nk;ch=1}
  var dn=new Date().getDate();S.rec.forEach(function(r){if((+r.dia||1)<=dn&&!S.gd.some(function(x){return x.r===r.id&&(x.f||"").slice(0,7)===nk})){S.gd.push({f:nk+"-"+("0"+(+r.dia||1)).slice(-2),d:r.d,c:r.c,m:r.m,r:r.id});ch=1}});
  if(ch)save()}
function catSp(c,k){return sum(inM(S.gd,k).concat(inM(S.tc,k)).filter(function(x){return x.c===c}),function(x){return x.m})}
function capBars(k){var h=CATS.map(function(c){var s=catSp(c,k),cap=+S.cap[c]||0;if(!s&&!cap)return"";var u=cap?s/cap:0,col=!cap?"var(--ac)":u>=1?"var(--er)":u>=.8?"var(--wa)":"var(--ok)";return'<div style="margin:6px 0"><div class="line" style="padding:0"><span>'+c+'</span><b>'+C(s)+(cap?' <small style="color:var(--mu)">de '+C(cap)+'</small>':"")+'</b></div><div class="bar" style="height:8px;margin:3px 0"><i style="width:'+Math.min(cap?u*100:100,100)+'%;background:'+col+'"></i></div></div>'}).join("");return h||'<span class="sub">Aún no hay gastos este mes.</span>'}

function porTj(){var o={};S.tj.forEach(function(x){if(x.n)o[x.n]=x});S.tc.forEach(function(x){if(x.t&&!o[x.t])o[x.t]={n:x.t,l:0,dia:0}});var n=Object.keys(o);
  return'<datalist id="tjs">'+n.map(function(k){return'<option value="'+esc(k)+'">'}).join("")+'</datalist>'+(n.length?'<h2>Por tarjeta</h2><div class="card">'+n.map(function(k){var c=o[k],l=S.tc.filter(function(x){return x.t===k}),pen=sum(l,function(x){return x.m})-sum(l,function(x){return x.p}),u=c.l?pen/c.l*100:0,dy=c.dia?dd(+c.dia):null;
    return'<div class="line"><span>'+esc(k)+'</span><b>'+C(pen)+(c.l?' <small style="color:var(--mu)">de '+C(c.l)+'</small>':"")+'</b></div>'+(c.l?'<div class="bar" style="height:8px;margin:2px 0 6px"><i style="width:'+Math.min(u,100)+'%;background:'+(u>=90?"var(--er)":u>=70?"var(--wa)":"var(--ok)")+'"></i></div>':"")+(dy===null?"":'<div class="sub" style="margin:0 0 6px">'+(dy===0?"Pago hoy":"Pago en "+dy+(dy===1?" día":" días"))+'</div>')}).join("")+'</div>':"")}
function alerts(){var a=[],k=td().slice(0,7);CATS.forEach(function(c){var cap=+S.cap[c]||0,sp=catSp(c,k);if(cap&&sp>cap)a.push("Te pasaste del tope de "+c);else if(cap&&sp>=cap*.8)a.push("Vas cerca del tope de "+c)});
  S.tj.forEach(function(c){if(!c.n||!c.dia)return;var l=S.tc.filter(function(x){return x.t===c.n}),pen=sum(l,function(x){return x.m})-sum(l,function(x){return x.p}),n=dd(+c.dia);if(pen>0&&n<=5)a.push("Pago de "+c.n+" en "+n+(n===1?" día":" días"))});return a}

function vMetas(){return'<h2>Otras metas</h2>'+S.metas.map(function(r,i){var d='data-l="metas" data-i="'+i+'" ',mo=+r.monto||0,ah=+r.ah||0,pg=mo?Math.min(ah/mo,1):0,ms=0;if(r.fecha)ms=Math.max(Math.ceil((new Date(r.fecha+"T00:00:00")-new Date())/(30*864e5)),0);var ap=Math.max(mo-ah,0);if(ms)ap/=ms;

function expCsv(){var q=function(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'},r=[["Mes","Ingresos","Gastos fijos","Gastos diarios","Tarjeta","Ahorro"]];mKeys().forEach(function(k){var d=mData(k);r.push([k,d.ing,d.fix,d.gd,d.tc,d.fl])});
  r.push([],["Gastos diarios"],["Fecha","Descripción","Categoría","Monto"]);S.gd.forEach(function(x){r.push([x.f,x.d,x.c,x.m])});r.push([],["Compras de tarjeta"],["Fecha","Descripción","Tarjeta","Categoría","Monto","Cubierto"]);S.tc.forEach(function(x){r.push([x.f,x.d,x.t,x.c,x.m,x.p])});
  var b=new Blob(["\ufeff"+r.map(function(x){return x.map(q).join(",")}).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="finanzas.csv";document.body.appendChild(a);a.click();a.remove()}
function render(){
  if(UI.pin&&!unl){renderLock();return}
  if(!uid){renderAuth();return}
  var t=tab(),y=window.scrollY;
  document.getElementById("app").innerHTML=(t==="tarjeta"?vTC():t==="meta"?vMeta():t==="gastos"?vGas():t==="deudas"?vDeu():t==="ajustes"?vSet():t==="resumen"?vRes():vPres())+

var app=document.getElementById("app");
app.addEventListener("change",function(e){
  var d=e.target.dataset,v=e.target.value;
  if(e.target.type==="number")v=parseFloat(v)||0;
  if(d.ui){UI[d.ui]=v;saveUI();applyTheme();render();return}
  if(d.tn){setTab(d.tn,{name:v});return}
  if(d.tv){setTab(d.tv,{on:e.target.checked});return}
  if(d.l!==undefined){S[d.l][d.i][d.k]=v}
  else if(d.s){var p=d.s.split(".");if(p.length===2)S[p[0]][p[1]]=v;else S[p[0]]=v}
  else return;
  save();render();
});
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;

  if(d.add){S[d.add].push(d.add==="tc"?{f:td(),d:"",c:"Comida",m:0,p:0,t:""}:d.add==="gd"?{f:td(),d:"",c:"Comida",m:0}:d.add==="deu"?{n:"",t:0,p:0}:d.add==="rec"?{id:Date.now(),d:"",c:"Comida",m:0,dia:1}:d.add==="tj"?{n:"",l:0,dia:1}:d.add==="metas"?{n:"",monto:0,ah:0,fecha:""}:(d.add==="ing"||d.add==="gas")?{n:"",q1:0,q2:0}:{n:"",m:0});save();render()}

});
